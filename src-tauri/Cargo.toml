[package]
name = "localagenda"
version = "0.2.0"
description = "LocalAgenda — calendário, tarefas e lembretes 100% offline, com IA local"
authors = ["Taylor"]
edition = "2021"
license = "MIT"
repository = "https://github.com/Anon5T4R/LocalAgenda"

[lib]
# O sufixo `_lib` evita conflito entre o nome da lib e o do binário no Windows
# (https://github.com/rust-lang/cargo/issues/8519).
name = "localagenda_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# tray-icon + image-png: fechar a janela minimiza pra bandeja (o app segue vivo
# pra disparar lembretes); reabre/sai pela bandeja.
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
# Um único DB em app_data (agenda não é "arquivo") — SQLite legítimo.
rusqlite = { version = "0.32", features = ["bundled"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
# Autostart opcional (opt-in em Configurações): abrir com o Windows pra os
# lembretes funcionarem sem o usuário abrir o app na mão.
tauri-plugin-autostart = "2"
