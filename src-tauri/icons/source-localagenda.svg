<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#0b2a6b" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- App tile -->
  <rect x="0" y="0" width="1024" height="1024" rx="224" fill="url(#bg)"/>

  <!-- Calendar card -->
  <g filter="url(#shadow)">
    <rect x="212" y="214" width="600" height="612" rx="44" fill="#ffffff"/>
    <!-- header band (domain color) -->
    <path d="M212 356 V258 a44 44 0 0 1 44 -44 H768 a44 44 0 0 1 44 44 V356 Z" fill="#2563eb"/>
  </g>

  <!-- binder rings -->
  <g fill="#1e3a8a">
    <rect x="380" y="176" width="40" height="96" rx="20"/>
    <rect x="604" y="176" width="40" height="96" rx="20"/>
  </g>

  <!-- day cells -->
  <g fill="#dbe4f0">
    <rect x="278" y="404" width="96" height="74" rx="12"/>
    <rect x="402" y="404" width="96" height="74" rx="12"/>
    <rect x="526" y="404" width="96" height="74" rx="12"/>
    <rect x="278" y="642" width="96" height="74" rx="12"/>
    <rect x="402" y="642" width="96" height="74" rx="12"/>
    <rect x="526" y="642" width="96" height="74" rx="12"/>
    <rect x="650" y="642" width="96" height="74" rx="12"/>
  </g>

  <!-- "today" cell highlighted with a check -->
  <rect x="650" y="404" width="96" height="74" rx="12" fill="#2563eb"/>
  <path d="M674 442 l16 16 l28 -30" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Easter egg: "Taylor" handwritten across the card -->
  <text x="512" y="602" text-anchor="middle"
        font-family="'Segoe Script','Brush Script MT','Comic Sans MS',cursive"
        font-size="104" font-style="italic" font-weight="700"
        fill="#2563eb">Taylor</text>
</svg>
